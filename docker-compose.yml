# docker-compose.yml

services:
  db:
    image: postgres:15
    container_name: cedar-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cedar}
      POSTGRES_USER: ${POSTGRES_USER:-cedar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cedar}
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 30
    networks: [cedar_local]

  api:
    container_name: cedar-api
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # локально удобно слушать прям на 8000
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      bash -lc '
        echo "Apply migrations..." &&
        python manage.py migrate --noinput &&
        # для локалки можно и runserver, но чтобы было одинаково — оставим gunicorn:
        gunicorn config.wsgi:application -c deploy/compose/gunicorn.conf.py
      '
    networks: [cedar_local]
    restart: unless-stopped

  # service "scheduler" рядом с backend
  scheduler:
    image: cedar-backend:dev
    working_dir: /app
    entrypoint: /bin/sh
    command:
      - -lc
      - |
        set -e
        # ждём БД (healthcheck уже есть у db)
        # ждем успешной миграции (повторяем, пока не пройдёт)
        until python manage.py migrate --noinput; do
          echo "waiting for migrations to apply...";
          sleep 3;
        done
        # основной цикл
        while :; do
          python manage.py webinar_maintain --once || echo "maintain failed";
          sleep 30;
        done
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy   # ← важный пункт
    restart: unless-stopped

volumes:
  pgdata_local:

networks:
  cedar_local:
    driver: bridge

